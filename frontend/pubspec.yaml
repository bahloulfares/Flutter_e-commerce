name: atelier7
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  get: ^4.6.6

  # HTTP & Config
  dio: ^5.7.0
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.6

  # Localisation
  flutter_localizations:
    sdk: flutter

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Cloudinary
  cloudinary_flutter: ^1.3.0
  cloudinary_public: ^0.23.1
  cloudinary_url_gen: ^1.6.0

  # ML Kit
  google_mlkit_barcode_scanning: ^0.13.0
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_translation: ^0.12.0
  google_mlkit_face_detection: ^0.12.0

  # Camera & Image
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2

  # Voice Search
  speech_to_text: ^7.0.0

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.4
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Permissions
  permission_handler: ^12.0.1

  # Authentication
  local_auth: ^2.3.0

  # Shopping Cart
  persistent_shopping_cart: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - .env.dev
    - .env.prod